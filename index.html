    const COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#8B5CF6', '#06B6D4', '#64748B'];

    // Auto-formatted input with Thousand Separator (Commas)
    const CurrencyInput = ({ value, onChange, placeholder = "0", className }) => {
      const displayValue = (value !== undefined && value !== null && value !== '') ? new Intl.NumberFormat('en-US').format(value) : '';
      const handleChange = (e) => {
        const raw = e.target.value.replace(/,/g, '').replace(/[^0-9]/g, '');
        if (raw === '') {
          onChange('');
        } else {
          onChange(Number(raw));
        }
      };
      return <input type="text" placeholder={placeholder} value={displayValue} onChange={handleChange} className={className} />;
    };

    // Format Number with Commas & LKR prefix
    const formatLKR = (val) => "LKR " + new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(Number(val || 0));
    const formatNum = (val) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(Number(val || 0));

    function App() {
      // Auth State
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('kd_auth_session') === 'true');
      const [loginCreds, setLoginCreds] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');

      // Google Sheet API State
      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('kd_google_script_url') || DEFAULT_GOOGLE_SCRIPT_URL);

      const [tempUrl, setTempUrl] = useState(scriptUrl);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState(null);

      // App Data State
      const [activeTab, setActiveTab] = useState('overview');
      const [meList, setMeList] = useState(() => {
        const saved = localStorage.getItem('kd_business_mes');
        if (saved) {
          const parsed = JSON.parse(saved);
          return parsed.map(m => ({ ...m, branch: m.branch || 'Kandy' }));
        }
        return INITIAL_MES;
      });
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedBranch, setSelectedBranch] = useState('ALL');
      const [selectedCluster, setSelectedCluster] = useState('ALL');
      const [notification, setNotification] = useState(null);

      // Selection for Daily ME Updating
      const [selectedMeId, setSelectedMeId] = useState(() => meList[0]?.id || '1');
      const [updateFormData, setUpdateFormData] = useState(() => meList[0] || INITIAL_MES[0]);
      
      // Direct Target Updates State
      const [targetDrafts, setTargetDrafts] = useState({});
      const [targetBranchFilter, setTargetBranchFilter] = useState('ALL');

      // Admin New ME Form
      const [newMe, setNewMe] = useState({
        name: '', branch: 'Kandy', cluster: 'Team Prabath', target: '', active: '', inHand: '',
        activeCount: '', inHandCount: '', collectionDue: '', collectionPaid: '',
        categories: { TW: 0, MB: 0, MN: 0, REG: 0, LC: 0, VL: 0 }
      });

      const [editingMe, setEditingMe] = useState(null);

      useEffect(() => {
        localStorage.setItem('kd_business_mes', JSON.stringify(meList));
      }, [meList]);

      useEffect(() => {
        if (notification) {
          const timer = setTimeout(() => setNotification(null), 3500);
          return () => clearTimeout(timer);
        }
      }, [notification]);

      useEffect(() => {
        const found = meList.find(m => m.id === selectedMeId);
        if (found) setUpdateFormData({ ...found, branch: found.branch || 'Kandy' });
      }, [selectedMeId, meList]);

      useEffect(() => {
        if (scriptUrl) {
          fetchFromGoogleSheet(scriptUrl, true);
        }
      }, []);

      // Google Sheet Sync Functions
      const fetchFromGoogleSheet = async (urlToUse = scriptUrl, silent = false) => {
        if (!urlToUse) {
          if (!silent) setShowConfigModal(true);
          return;
        }
        setIsSyncing(true);
        try {
          const response = await fetch(urlToUse);
          const result = await response.json();
          if (result.status === 'success' && Array.isArray(result.data) && result.data.length > 0) {
            const normalized = result.data.map(m => ({ ...m, branch: m.branch || 'Kandy' }));
            setMeList(normalized);
            setLastSyncTime(new Date().toLocaleTimeString());
            if (!silent) setNotification({ type: 'success', text: 'Google Sheet වෙතින් දත්ත සාර්ථකව Load විය!' });
          } else if (result.status === 'success' && result.data.length === 0) {
            await syncToGoogleSheet(meList, urlToUse, true);
          } else {
            throw new Error(result.message || 'Invalid response');
          }
        } catch (err) {
          console.error('Sheet Fetch Error:', err);
          if (!silent) setNotification({ type: 'error', text: 'Google Sheet සම්බන්ධතාවය අසාර්ථකයි. URL එක පරීක්ෂා කරන්න.' });
        } finally {
          setIsSyncing(false);
        }
      };

      const syncToGoogleSheet = async (updatedList, urlToUse = scriptUrl, silent = false) => {
        if (!urlToUse) {
          if (!silent) setNotification({ type: 'info', text: 'Local Storage හි Save විය (Google Sheet සම්බන්ධ කර නැත).' });
          return;
        }
        setIsSyncing(true);
        try {
          const response = await fetch(urlToUse, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'SYNC_ALL', data: updatedList })
          });
          const result = await response.json();
          if (result.status === 'success') {
            setLastSyncTime(new Date().toLocaleTimeString());
            if (!silent) setNotification({ type: 'success', text: 'Google Sheet එකට සාර්ථකව Save කරන ලදී!' });
          } else {
            throw new Error(result.message || 'Save error');
          }
        } catch (err) {
          console.error('Sheet Save Error:', err);
          if (!silent) setNotification({ type: 'error', text: 'Local Save විය, නමුත් Google Sheet Sync අසාර්ථකයි!' });
        } finally {
          setIsSyncing(false);
        }
      };

      const handleSaveScriptUrl = (e) => {
        e.preventDefault();
        const cleaned = tempUrl.trim();
        setScriptUrl(cleaned);
        localStorage.setItem('kd_google_script_url', cleaned);
        setShowConfigModal(false);
        if (cleaned) {
          fetchFromGoogleSheet(cleaned, false);
        } else {
          setNotification({ type: 'info', text: 'Google Sheet URL ඉවත් කරන ලදී.' });
        }
      };

      // Login / Logout
      const handleLogin = (e) => {
        e.preventDefault();
        if (loginCreds.username.trim() === 'admin' && loginCreds.password === 'admin123') {
          setIsAuthenticated(true);
          localStorage.setItem('kd_auth_session', 'true');
          setLoginError('');
          setNotification({ type: 'success', text: 'Welcome back, Admin!' });
        } else {
          setLoginError('Invalid credentials. Use admin / admin123');
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        localStorage.removeItem('kd_auth_session');
        setLoginCreds({ username: '', password: '' });
      };

      // Aggregate Financials
      const totals = useMemo(() => {
        return meList.reduce((acc, me) => {
          const activeVal = Number(me.active || 0);
          const inHandVal = Number(me.inHand || 0);
          const targetVal = Number(me.target || 0);
          const combinedVal = activeVal + inHandVal;
          const due = Number(me.collectionDue || 0);
          const paid = Number(me.collectionPaid || 0);
          acc.target += targetVal;
          acc.active += activeVal;
          acc.inHand += inHandVal;
          acc.combined += combinedVal;
          acc.activeCount += Number(me.activeCount || 0);
          acc.inHandCount += Number(me.inHandCount || 0);
          acc.collectionDue += due;
          acc.collectionPaid += paid;
          acc.categories.TW += Number(me.categories?.TW || 0);
          acc.categories.MB += Number(me.categories?.MB || 0);
          acc.categories.MN += Number(me.categories?.MN || 0);
          acc.categories.REG += Number(me.categories?.REG || 0);
          acc.categories.LC += Number(me.categories?.LC || 0);
          acc.categories.VL += Number(me.categories?.VL || 0);
          return acc;
        }, {
          target: 0, active: 0, inHand: 0, combined: 0,
          activeCount: 0, inHandCount: 0, collectionDue: 0, collectionPaid: 0,
          categories: { TW: 0, MB: 0, MN: 0, REG: 0, LC: 0, VL: 0 }
        });
      }, [meList]);

      const overallAchievedPct = totals.target > 0 ? ((totals.active / totals.target) * 100).toFixed(1) : 0;
      const overallCombinedPct = totals.target > 0 ? ((totals.combined / totals.target) * 100).toFixed(1) : 0;
      const needToTarget = Math.max(0, totals.target - totals.active);

      // Cluster Summary Cards for Dashboard
      const clusterSummary = useMemo(() => {
        const clusters = {};
        meList.forEach(me => {
          const cluster = me.cluster || 'Unassigned';
          if (!clusters[cluster]) {
            clusters[cluster] = { name: cluster, count: 0, target: 0, active: 0, inHand: 0 };
          }
          clusters[cluster].count += 1;
          clusters[cluster].target += Number(me.target || 0);
          clusters[cluster].active += Number(me.active || 0);
          clusters[cluster].inHand += Number(me.inHand || 0);
        });
        return Object.values(clusters);
      }, [meList]);

      // Monthly Office (Branch) & Cluster Summary
      const officeSummary = useMemo(() => {
        const branches = {};
        meList.forEach(me => {
          const b = me.branch || 'Kandy';

                                placeholder="Enter new target..."
                                value={newTargetVal} 
                                onChange={(val) => setTargetDrafts({ ...targetDrafts, [me.id]: { ...draft, newTarget: val } })} 
                                className="w-full bg-slate-950 border border-blue-500/40 rounded-lg px-3 py-1.5 text-sm text-emerald-400 font-bold text-right focus:outline-none focus:border-blue-400" 
                              />
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* TAB 5: COLLECTIONS TRACKER                                */}
            {/* ========================================================= */}
            {activeTab === 'collections' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs text-slate-400 font-medium">TOTAL 6-MONTH COLLECTION DUE</span>
                    <div className="text-2xl font-bold text-slate-100 mt-1">{formatLKR(totals.collectionDue)}</div>
                  </div>
                  <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs text-slate-400 font-medium">TOTAL RECOVERED / PAID</span>
                    <div className="text-2xl font-bold text-emerald-400 mt-1">{formatLKR(totals.collectionPaid)}</div>
                  </div>
                  <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
                    <span className="text-xs text-slate-400 font-medium">COLLECTION RECOVERY RATE</span>
                    <div className="text-2xl font-bold text-purple-400 mt-1">
                      {totals.collectionDue > 0 ? ((totals.collectionPaid / totals.collectionDue) * 100).toFixed(1) : 0}%
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2"><DollarSign className="w-5 h-5 text-purple-400" /> ME Collection Tracker</h3>
                  <div className="overflow-x-auto rounded-xl border border-slate-800">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800">
                        <tr>
                          <th className="px-4 py-3">Executive</th>
                          <th className="px-4 py-3">Branch</th>
                          <th className="px-4 py-3">Cluster</th>
                          <th className="px-4 py-3 text-right">6-Mo Collection Due</th>
                          <th className="px-4 py-3 text-right">Collection Paid</th>
                          <th className="px-4 py-3 text-right">Outstanding Collection</th>
                          <th className="px-4 py-3 text-center">Recovery Rate</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {meList.map((me) => {
                          const due = Number(me.collectionDue || 0);
                          const paid = Number(me.collectionPaid || 0);
                          const outstanding = Math.max(0, due - paid);
                          const rate = due > 0 ? ((paid / due) * 100).toFixed(1) : 0;
                          return (
                            <tr key={me.id} className="hover:bg-slate-800/40">
                              <td className="px-4 py-3 font-semibold text-white">{me.name}</td>
                              <td className="px-4 py-3 text-xs text-blue-300">{me.branch || 'Kandy'}</td>
                              <td className="px-4 py-3 text-xs text-slate-400">{me.cluster}</td>
                              <td className="px-4 py-3 text-right font-medium">{formatLKR(due)}</td>
                              <td className="px-4 py-3 text-right text-emerald-400 font-semibold">{formatLKR(paid)}</td>
                              <td className="px-4 py-3 text-right text-rose-400 font-medium">{formatLKR(outstanding)}</td>
                              <td className="px-4 py-3 text-center font-bold text-purple-300">{rate}%</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* TAB 6: ME ACCESS MANAGEMENT                               */}
            {/* ========================================================= */}
            {activeTab === 'access-mgmt' && (
              <div className="space-y-6">
                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2"><UserPlus className="w-5 h-5 text-emerald-400" /> Add New Marketing Executive (ME)</h3>
                  <form onSubmit={handleAddMe} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Executive Name</label>
                      <input type="text" required placeholder="e.g. Kasun Silva" value={newMe.name} onChange={(e) => setNewMe({ ...newMe, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Office / Branch</label>
                      <input type="text" required placeholder="e.g. Kandy" value={newMe.branch} onChange={(e) => setNewMe({ ...newMe, branch: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Cluster / Team</label>
                      <select value={newMe.cluster} onChange={(e) => setNewMe({ ...newMe, cluster: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white">
                        {availableClusters.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Target (LKR)</label>
                      <CurrencyInput placeholder="20,000,000" value={newMe.target} onChange={(val) => setNewMe({ ...newMe, target: val })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Initial Active Value</label>
                      <CurrencyInput placeholder="0" value={newMe.active} onChange={(val) => setNewMe({ ...newMe, active: val })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Initial In-Hand Value</label>
                      <CurrencyInput placeholder="0" value={newMe.inHand} onChange={(val) => setNewMe({ ...newMe, inHand: val })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" />
                    </div>
                    <div className="sm:col-span-2 flex items-end">
                      <button type="submit" disabled={isSyncing} className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm rounded-xl flex items-center justify-center gap-2">
                        <PlusCircle className="w-4 h-4" /> Add Executive To System
                      </button>
                    </div>
                  </form>
                </div>

                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2"><ShieldCheck className="w-5 h-5 text-blue-400" /> Executive Access Directory ({meList.length} Active MEs)</h3>
                  <div className="overflow-x-auto rounded-xl border border-slate-800">
                    <table className="w-full text-left text-sm text-slate-300">
                      <thead className="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800">
                        <tr>
                          <th className="px-4 py-3">ME Name</th>
                          <th className="px-4 py-3">Branch</th>
                          <th className="px-4 py-3">Cluster / Team</th>
                          <th className="px-4 py-3 text-right">Target</th>
                          <th className="px-4 py-3 text-right">Active</th>
                          <th className="px-4 py-3 text-right">In-Hand</th>
                          <th className="px-4 py-3 text-center">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {meList.map((me) => (
                          <tr key={me.id} className="hover:bg-slate-800/40">
                            <td className="px-4 py-3 font-semibold text-white">{me.name}</td>
                            <td className="px-4 py-3 text-xs text-blue-300">{me.branch || 'Kandy'}</td>
                            <td className="px-4 py-3 text-xs text-slate-400">{me.cluster}</td>
                            <td className="px-4 py-3 text-right font-medium">{formatLKR(me.target)}</td>
                            <td className="px-4 py-3 text-right text-emerald-400">{formatLKR(me.active)}</td>
                            <td className="px-4 py-3 text-right text-amber-400">{formatLKR(me.inHand)}</td>
                            <td className="px-4 py-3 text-center space-x-2">
                              <button onClick={() => setEditingMe({ ...me, branch: me.branch || 'Kandy' })} className="p-1.5 bg-slate-800 hover:bg-blue-600/30 text-blue-400 rounded-lg border border-slate-700"><Edit3 className="w-4 h-4" /></button>
                              <button onClick={() => handleDeleteMe(me.id, me.name)} className="p-1.5 bg-slate-800 hover:bg-rose-600/30 text-rose-400 rounded-lg border border-slate-700"><Trash2 className="w-4 h-4" /></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* GOOGLE SHEET SETUP MODAL */}
          {showConfigModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg w-full space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white flex items-center gap-2"><Cloud className="w-5 h-5 text-blue-400" /> Connect Google Sheet Database</h3>
                  <button onClick={() => setShowConfigModal(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleSaveScriptUrl} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Google Apps Script Web App URL</label>
                    <input type="url" placeholder="https://script.google.com/macros/s/.../exec" value={tempUrl} onChange={(e) => setTempUrl(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white font-mono" />
                  </div>
                  <div className="flex justify-between items-center pt-2">
                    <button type="button" onClick={() => syncToGoogleSheet(meList, tempUrl.trim(), false)} className="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 text-xs font-semibold rounded-lg">
                      Push Current Data to Sheet
                    </button>
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setShowConfigModal(false)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-semibold rounded-lg">Cancel</button>
                      <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg">Save & Connect</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* EDIT ME MODAL */}
          {editingMe && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white">Edit Executive: {editingMe.name}</h3>
                  <button onClick={() => setEditingMe(null)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleSaveEdit} className="space-y-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Executive Name</label>
                    <input type="text" value={editingMe.name} onChange={(e) => setEditingMe({ ...editingMe, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Office / Branch</label>
                    <input type="text" value={editingMe.branch || 'Kandy'} onChange={(e) => setEditingMe({ ...editingMe, branch: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Cluster / Team</label>
                    <select value={editingMe.cluster} onChange={(e) => setEditingMe({ ...editingMe, cluster: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
                      {availableClusters.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Monthly Target (LKR)</label>
                    <CurrencyInput value={editingMe.target} onChange={(val) => setEditingMe({ ...editingMe, target: val })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white" />
                  </div>
                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setEditingMe(null)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-semibold rounded-lg">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-lg">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
            KD Business Update & ME Management System &copy; {new Date().getFullYear()} &bull; Powered by Google Sheets Cloud
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
