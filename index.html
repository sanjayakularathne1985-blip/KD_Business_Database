    const COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#8B5CF6', '#06B6D4', '#64748B'];

    // Auto-formatted input for Thousands Separator
    const CurrencyInput = ({ value, onChange, className }) => {
      const displayValue = value ? new Intl.NumberFormat('en-US').format(value) : '';
      const handleChange = (e) => {
        const raw = e.target.value.replace(/,/g, '');
        if (!isNaN(raw) && raw !== '') {
          onChange(Number(raw));
        } else if (raw === '') {
          onChange('');
        }
      };
      return <input type="text" value={displayValue} onChange={handleChange} className={className} />;
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('kd_auth_session') === 'true');
      const [loginCreds, setLoginCreds] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');

      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('kd_google_script_url') || DEFAULT_GOOGLE_SCRIPT_URL);
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [tempUrl, setTempUrl] = useState(scriptUrl);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState(null);

      const [activeTab, setActiveTab] = useState('overview');
      const [meList, setMeList] = useState(() => {
        const saved = localStorage.getItem('kd_business_mes');
        return saved ? JSON.parse(saved) : INITIAL_MES;
      });
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCluster, setSelectedCluster] = useState('ALL');
      const [notification, setNotification] = useState(null);

      const [selectedMeId, setSelectedMeId] = useState(() => meList[0]?.id || '1');
      const [updateFormData, setUpdateFormData] = useState(() => meList[0] || INITIAL_MES[0]);
      
      const [targetDrafts, setTargetDrafts] = useState({});

      const [newMe, setNewMe] = useState({
        name: '', branch: 'Kandy', cluster: 'Team Prabath', target: '', active: '', inHand: '',
        activeCount: '', inHandCount: '', collectionDue: '', collectionPaid: '',
        categories: { TW: 0, MB: 0, MN: 0, REG: 0, LC: 0, VL: 0 }
      });

      const [editingMe, setEditingMe] = useState(null);

      useEffect(() => { localStorage.setItem('kd_business_mes', JSON.stringify(meList)); }, [meList]);

      useEffect(() => {
        if (notification) {
          const timer = setTimeout(() => setNotification(null), 3500);
          return () => clearTimeout(timer);
        }
      }, [notification]);

      useEffect(() => {
        const found = meList.find(m => m.id === selectedMeId);
        if (found) setUpdateFormData({ ...found });
      }, [selectedMeId, meList]);

      useEffect(() => {
        if (scriptUrl) fetchFromGoogleSheet(scriptUrl, true);
      }, []);

      const fetchFromGoogleSheet = async (urlToUse = scriptUrl, silent = false) => {
        if (!urlToUse) {
          if (!silent) setShowConfigModal(true);
          return;
        }
        setIsSyncing(true);
        try {
          const response = await fetch(urlToUse);
          const result = await response.json();
          if (result.status === 'success' && Array.isArray(result.data) && result.data.length > 0) {
            setMeList(result.data);
            setLastSyncTime(new Date().toLocaleTimeString());
            if (!silent) setNotification({ type: 'success', text: 'Data Load Successful!' });
          } else if (result.status === 'success' && result.data.length === 0) {
            await syncToGoogleSheet(meList, urlToUse, true);
          }
        } catch (err) {
          if (!silent) setNotification({ type: 'error', text: 'Connection failed.' });
        } finally {
          setIsSyncing(false);
        }
      };

      const syncToGoogleSheet = async (updatedList, urlToUse = scriptUrl, silent = false) => {
        if (!urlToUse) return;
        setIsSyncing(true);
        try {
          const response = await fetch(urlToUse, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'SYNC_ALL', data: updatedList })
          });
          const result = await response.json();
          if (result.status === 'success') {
            setLastSyncTime(new Date().toLocaleTimeString());
            if (!silent) setNotification({ type: 'success', text: 'Sheet Synced Successfully!' });
          }
        } catch (err) {} finally {
          setIsSyncing(false);
        }
      };

      const handleSaveScriptUrl = (e) => {
        e.preventDefault();
        const cleaned = tempUrl.trim();
        setScriptUrl(cleaned);
        localStorage.setItem('kd_google_script_url', cleaned);
        setShowConfigModal(false);
        if (cleaned) fetchFromGoogleSheet(cleaned, false);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginCreds.username.trim() === 'admin' && loginCreds.password === 'admin123') {
          setIsAuthenticated(true);
          localStorage.setItem('kd_auth_session', 'true');
        } else {
          setLoginError('Invalid credentials. Use admin / admin123');
        }
      };

      const totals = useMemo(() => {
        return meList.reduce((acc, me) => {
          acc.target += Number(me.target || 0);
          acc.active += Number(me.active || 0);
          acc.inHand += Number(me.inHand || 0);
          acc.combined += (Number(me.active || 0) + Number(me.inHand || 0));
          acc.activeCount += Number(me.activeCount || 0);
          acc.inHandCount += Number(me.inHandCount || 0);
          acc.collectionDue += Number(me.collectionDue || 0);
          acc.collectionPaid += Number(me.collectionPaid || 0);
          acc.categories.TW += Number(me.categories?.TW || 0);
          acc.categories.MB += Number(me.categories?.MB || 0);
          acc.categories.MN += Number(me.categories?.MN || 0);
          acc.categories.REG += Number(me.categories?.REG || 0);
          acc.categories.LC += Number(me.categories?.LC || 0);
          acc.categories.VL += Number(me.categories?.VL || 0);
          return acc;
        }, {
          target: 0, active: 0, inHand: 0, combined: 0, activeCount: 0, inHandCount: 0, collectionDue: 0, collectionPaid: 0,
          categories: { TW: 0, MB: 0, MN: 0, REG: 0, LC: 0, VL: 0 }
        });
      }, [meList]);

      const overallAchievedPct = totals.target > 0 ? ((totals.active / totals.target) * 100).toFixed(1) : 0;
      const overallCombinedPct = totals.target > 0 ? ((totals.combined / totals.target) * 100).toFixed(1) : 0;
      const needToTarget = Math.max(0, totals.target - totals.active);

      // Branch & Cluster Summary Calculation
      const officeSummary = useMemo(() => {
        const branches = {};
        meList.forEach(me => {
          const b = me.branch || 'Unknown';
          const c = me.cluster || 'Unknown';
          if (!branches[b]) branches[b] = { totals: { target: 0, active: 0, inHand: 0 }, clusters: {} };
          if (!branches[b].clusters[c]) branches[b].clusters[c] = { target: 0, active: 0, inHand: 0, count: 0 };
          
          branches[b].totals.target += Number(me.target || 0);
          branches[b].totals.active += Number(me.active || 0);
          branches[b].totals.inHand += Number(me.inHand || 0);
          
          branches[b].clusters[c].target += Number(me.target || 0);
          branches[b].clusters[c].active += Number(me.active || 0);
          branches[b].clusters[c].inHand += Number(me.inHand || 0);
          branches[b].clusters[c].count += 1;
        });
        return branches;
      }, [meList]);

      const filteredMEs = useMemo(() => {
        return meList.filter(me => {
          const matchesSearch = me.name.toLowerCase().includes(searchTerm.toLowerCase()) || me.cluster.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCluster = selectedCluster === 'ALL' || me.cluster === selectedCluster;
          return matchesSearch && matchesCluster;
        });
      }, [meList, searchTerm, selectedCluster]);

      const handleUpdateSubmit = async (e) => {
        e.preventDefault();
        const updatedList = meList.map(me => me.id === updateFormData.id ? { ...updateFormData } : me);
        setMeList(updatedList);
        await syncToGoogleSheet(updatedList);
      };

      // Save Target Tab Changes
      const handleSaveTargetUpdates = async () => {
        if(Object.keys(targetDrafts).length === 0) return;
        const updatedList = meList.map(me => {
          if (targetDrafts[me.id] !== undefined) {
             return { ...me, target: targetDrafts[me.id] };
          }
          return me;
        });
        setMeList(updatedList);
        setTargetDrafts({});
        await syncToGoogleSheet(updatedList);
      };

      const handleAddMe = async (e) => {
        e.preventDefault();
        if (!newMe.name.trim()) return;
        const created = {
          id: Date.now().toString(), name: newMe.name.trim(), branch: newMe.branch, cluster: newMe.cluster,
          target: Number(newMe.target) || 0, active: Number(newMe.active) || 0, inHand: Number(newMe.inHand) || 0,
          activeCount: Number(newMe.activeCount) || 0, inHandCount: Number(newMe.inHandCount) || 0, collectionDue: Number(newMe.collectionDue) || 0, collectionPaid: Number(newMe.collectionPaid) || 0,
          categories: { TW: Number(newMe.categories.TW) || 0, MB: Number(newMe.categories.MB) || 0, MN: Number(newMe.categories.MN) || 0, REG: Number(newMe.categories.REG) || 0, LC: Number(newMe.categories.LC) || 0, VL: Number(newMe.categories.VL) || 0 }
        };
        const updatedList = [...meList, created];
        setMeList(updatedList);
        setNewMe({ name: '', branch: 'Kandy', cluster: 'Team Prabath', target: '', active: '', inHand: '', activeCount: '', inHandCount: '', collectionDue: '', collectionPaid: '', categories: { TW: 0, MB: 0, MN: 0, REG: 0, LC: 0, VL: 0 }});
        await syncToGoogleSheet(updatedList);
      };

      const handleDeleteMe = async (id, name) => {
        if (window.confirm(`Are you sure you want to remove ME: ${name}?`)) {
          const updatedList = meList.filter(m => m.id !== id);
          setMeList(updatedList);
          if (selectedMeId === id && updatedList.length > 0) setSelectedMeId(updatedList[0].id);
          await syncToGoogleSheet(updatedList);
        }
      };

      const handleSaveEdit = async (e) => {
        e.preventDefault();
        const updatedList = meList.map(m => m.id === editingMe.id ? editingMe : m);
        setMeList(updatedList);
        setEditingMe(null);
        await syncToGoogleSheet(updatedList);

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
