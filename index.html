<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KD Business Update - Live Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Prop-Types & Recharts -->
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide-react@0.378.0/dist/umd/lucide-react.min.js"></script>
  
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    
    // Fix for CDN Global Variables
    const Lucide = window.lucide || window.lucideReact || window.LucideReact;
    const {
      Users, UserPlus, Trash2, Edit3, Save, X, RefreshCw, Download, Upload,
      TrendingUp, FileText, CheckCircle2, AlertCircle, PieChart: PieChartIcon,
      BarChart3, Layers, DollarSign, Search, ShieldCheck, ChevronRight, Activity, PlusCircle,
      LogOut, Lock, User, KeyRound, HelpCircle, Cloud, CloudOff, Settings, Link2
    } = Lucide;

    const {
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
      PieChart, Pie, Cell
    } = window.Recharts;

    // =========================================================================
    // ඔබගේ GOOGLE APPS SCRIPT WEB APP URL එක මෙතැනට PASTE කරන්න
    // =========================================================================
    const DEFAULT_GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwp4TkTk0i0OuN_P8dOQbFyw925cOspOE73kno1CpdEMzYmZimS1vc39Dp_TEY6TPH4/exec"; 

    const INITIAL_MES = [
      { id: '1', name: 'Prabath', cluster: 'Team Prabath', target: 25000000, active: 14200000, inHand: 6800000, categories: { TW: 4500000, MB: 5200000, MN: 3800000, REG: 4000000, LC: 2000000, VL: 1500000 }, activeCount: 28, inHandCount: 12, collectionDue: 3500000, collectionPaid: 2900000 },
      { id: '2', name: 'Madawa', cluster: 'Team Madawa', target: 22000000, active: 12800000, inHand: 5400000, categories: { TW: 3800000, MB: 4500000, MN: 3100000, REG: 3900000, LC: 1800000, VL: 1100000 }, activeCount: 24, inHandCount: 10, collectionDue: 2800000, collectionPaid: 2400000 },
      { id: '3', name: 'Sachin', cluster: 'Team Sachin', target: 20000000, active: 11500000, inHand: 6100000, categories: { TW: 3500000, MB: 4100000, MN: 3000000, REG: 4200000, LC: 1500000, VL: 1300000 }, activeCount: 22, inHandCount: 11, collectionDue: 3100000, collectionPaid: 2750000 },
      { id: '4', name: 'Nilan', cluster: 'Team Prabath', target: 18000000, active: 9800000, inHand: 4900000, categories: { TW: 2900000, MB: 3600000, MN: 2500000, REG: 3200000, LC: 1400000, VL: 1100000 }, activeCount: 19, inHandCount: 8, collectionDue: 2400000, collectionPaid: 2100000 },
      { id: '5', name: 'Shehan', cluster: 'Team Prabath', target: 17500000, active: 8900000, inHand: 4200000, categories: { TW: 2800000, MB: 3100000, MN: 2200000, REG: 3000000, LC: 1100000, VL: 900000 }, activeCount: 17, inHandCount: 7, collectionDue: 2100000, collectionPaid: 1850000 }
    ];

    const COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#8B5CF6', '#06B6D4', '#64748B'];

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('kd_auth_session') === 'true');
      const [loginCreds, setLoginCreds] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');

      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('kd_google_script_url') || DEFAULT_GOOGLE_SCRIPT_URL);
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [tempUrl, setTempUrl] = useState(scriptUrl);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState(null);

      const [activeTab, setActiveTab] = useState('overview');
      const [meList, setMeList] = useState(() => {
        const saved = localStorage.getItem('kd_business_mes');
        return saved ? JSON.parse(saved) : INITIAL_MES;
      });
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCluster, setSelectedCluster] = useState('ALL');
      const [notification, setNotification] = useState(null);

      const [selectedMeId, setSelectedMeId] = useState(() => meList[0]?.id || '1');
      const [updateFormData, setUpdateFormData] = useState(() => meList[0] || INITIAL_MES[0]);

      const [newMe, setNewMe] = useState({
        name: '', cluster: 'Team Prabath', target: '', active: '', inHand: '',
        activeCount: '', inHandCount: '', collectionDue: '', collectionPaid: '',
        categories: { TW: 0, MB: 0, MN: 0, REG: 0, LC: 0, VL: 0 }
      });

      const [editingMe, setEditingMe] = useState(null);

      useEffect(() => {
        localStorage.setItem('kd_business_mes', JSON.stringify(meList));
      }, [meList]);

      useEffect(() => {
        if (notification) {
          const timer = setTimeout(() => setNotification(null), 3500);
          return () => clearTimeout(timer);
        }
      }, [notification]);

      useEffect(() => {
        const found = meList.find(m => m.id === selectedMeId);
        if (found) setUpdateFormData({ ...found });
      }, [selectedMeId, meList]);

      useEffect(() => {
        if (scriptUrl) fetchFromGoogleSheet(scriptUrl, true);
      }, []);

      const fetchFromGoogleSheet = async (urlToUse = scriptUrl, silent = false) => {
        if (!urlToUse) {
          if (!silent) setShowConfigModal(true);
          return;
        }
        setIsSyncing(true);
        try {
          const response = await fetch(urlToUse);
          const result = await response.json();
          if (result.status === 'success' && Array.isArray(result.data) && result.data.length > 0) {
            setMeList(result.data);
            setLastSyncTime(new Date().toLocaleTimeString());
            if (!silent) setNotification({ type: 'success', text: 'Data loaded from Google Sheet!' });
          } else if (result.status === 'success' && result.data.length === 0) {
            await syncToGoogleSheet(meList, urlToUse, true);
          }
        } catch (err) {
          console.error(err);
          if (!silent) setNotification({ type: 'error', text: 'Connection failed.' });
        } finally {
          setIsSyncing(false);
        }
      };

      const syncToGoogleSheet = async (updatedList, urlToUse = scriptUrl, silent = false) => {
        if (!urlToUse) return;
        setIsSyncing(true);
        try {
          const response = await fetch(urlToUse, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'SYNC_ALL', data: updatedList })
          });
          const result = await response.json();
          if (result.status === 'success') {
            setLastSyncTime(new Date().toLocaleTimeString());
            if (!silent) setNotification({ type: 'success', text: 'Saved to Google Sheet!' });
          }
        } catch (err) {
          console.error(err);
        } finally {
          setIsSyncing(false);
        }
      };

      const handleSaveScriptUrl = (e) => {
        e.preventDefault();
        const cleaned = tempUrl.trim();
        setScriptUrl(cleaned);
        localStorage.setItem('kd_google_script_url', cleaned);
        setShowConfigModal(false);
        if (cleaned) fetchFromGoogleSheet(cleaned, false);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginCreds.username.trim() === 'admin' && loginCreds.password === 'admin123') {
          setIsAuthenticated(true);
          localStorage.setItem('kd_auth_session', 'true');
          setLoginError('');
        } else {
          setLoginError('Invalid credentials. Use admin / admin123');
        }
      };

      const totals = useMemo(() => {
        return meList.reduce((acc, me) => {
          acc.target += Number(me.target || 0);
          acc.active += Number(me.active || 0);
          acc.inHand += Number(me.inHand || 0);
          return acc;
        }, { target: 0, active: 0, inHand: 0 });
      }, [meList]);

      const formatLKR = (val) => new Intl.NumberFormat('en-LK', { style: 'currency', currency: 'LKR', maximumFractionDigits: 0 }).format(val || 0);

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <h1 className="text-2xl font-bold text-white">KD Business Update</h1>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <input type="text" placeholder="Username (admin)" value={loginCreds.username} onChange={(e) => setLoginCreds({ ...loginCreds, username: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                <input type="password" placeholder="Password (admin123)" value={loginCreds.password} onChange={(e) => setLoginCreds({ ...loginCreds, password: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl">Sign In</button>
                {loginError && <p className="text-rose-400 text-xs text-center">{loginError}</p>}
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center pt-10">
          <h1 className="text-3xl font-bold text-white mb-4">Dashboard Successfully Loaded!</h1>
          <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-2xl w-full text-center space-y-4">
             <div className="flex justify-center mb-4">
                <Activity className="w-16 h-16 text-emerald-400" />
             </div>
             <p className="text-slate-300">
               දැන් System එක සාර්ථකව Render වෙනවා. ඔබට සම්පූර්ණ Dashboard එක බලාගැනීමට අවශ්‍ය නම් කලින් ලබා දුන් සම්පූර්ණ කේතයේ <b>Lucide</b> සහ <b>Recharts</b> import කරන කොටස පමණක් ඉහත පරිදි වෙනස් කරගන්න.
             </p>
             <button onClick={() => { localStorage.removeItem('kd_auth_session'); window.location.reload(); }} className="mt-4 px-4 py-2 bg-rose-600 text-white rounded-lg text-sm">Logout</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
